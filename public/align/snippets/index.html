<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Humantic AI - Align: app snippets</title>
<style>
:root{--ink:#14201f;--muted:#5a6b69;--line:#dfe8e7;--bg:#f3f8f7;--teal:#0f8f86}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI",system-ui,sans-serif;padding:0 16px}
.wrap{max-width:1040px;margin:0 auto;padding:36px 0 64px}
.brand{color:var(--teal);font-weight:800;letter-spacing:.1em;font-size:12px;text-transform:uppercase}
h1{font:800 30px/1.2 "Segoe UI",system-ui,sans-serif;margin:12px 0 6px}
.lede{color:var(--muted);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:18px}
figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
figure img{width:100%;height:auto;display:block;border-radius:8px}
figcaption{font-size:14px;color:var(--muted);margin-top:8px}
.foot{color:var(--muted);font-size:13px;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Humantic Digital · Humantic AI - Align</div>
  <h1>App snippets</h1>
  <p class="lede">Screens from Humantic AI - Align, with illustrative sample data.</p>
  <div class="grid">
    <figure><img src="img/00-manager-view.png" alt="Manager view screen" loading="lazy"><figcaption>Manager view: the executive overview</figcaption></figure>
    <figure><img src="img/01-team-board.png" alt="Team board screen" loading="lazy"><figcaption>Team board</figcaption></figure>
    <figure><img src="img/02-capture-inbox.png" alt="Capture inbox screen" loading="lazy"><figcaption>Capture inbox</figcaption></figure>
    <figure><img src="img/03-priorities-waiting.png" alt="Priorities and waiting screen" loading="lazy"><figcaption>Priorities and waiting</figcaption></figure>
    <figure><img src="img/04-communication-coach.png" alt="Calm communication screen" loading="lazy"><figcaption>Calm communication</figcaption></figure>
    <figure><img src="img/05-weekly-reset-index.png" alt="Weekly reset and index screen" loading="lazy"><figcaption>Weekly reset and index</figcaption></figure>
    <figure><img src="img/06-core-features.png" alt="Core features screen" loading="lazy"><figcaption>Core features</figcaption></figure>
    <figure><img src="img/07-hr-wellbeing.png" alt="HR and wellbeing screen" loading="lazy"><figcaption>HR and wellbeing</figcaption></figure>
  </div>
  <p class="foot">Illustrative example. All names and figures are sample data.</p>
</div>
</body>
</html>
